<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스토리즘 캠프 비품창고</title>
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="비품창고">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef1ef; --surface:#ffffff; --sunk:#e3e8e5; --fg:#1b2420; --muted:#5d6b64; --line:#cfd8d3;
  --tape:#ffd23f; --tape-ink:#2a2306; --accent:#1f6f5c; --accent-ink:#ffffff;
  --ok:#2f8a4a; --low:#c27a00; --out:#c23a2b; --unk:#8a958f;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 6px 18px rgba(20,30,25,.06);
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111614; --surface:#1a201d; --sunk:#232a27; --fg:#e7ece9; --muted:#9aa8a1; --line:#2f3834;
  --tape:#f2c934; --tape-ink:#231c02; --accent:#5cc3a6; --accent-ink:#06261d;
  --ok:#5bc27a; --low:#e6a43a; --out:#ee6b5c; --unk:#7f8b85;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.01em;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.me{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--sunk);border:0;border-radius:999px;padding:6px 10px;white-space:nowrap}
.me b{color:var(--fg)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:5px;padding:4px 10px;border-radius:999px;background:var(--sunk);font-size:12px;color:var(--muted);border:0}
.stat b{font-family:var(--f-mono);font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums}
.stat.low b{color:var(--low)} .stat.out b{color:var(--out)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px 2px 10px;font-weight:500;color:var(--muted);font-size:14px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--tape)}
nav.tabs .n{font-family:var(--f-mono);font-size:12px;margin-left:4px;color:var(--low)}

main .wrap{padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
.notice{padding:12px 14px;border-radius:10px;background:var(--sunk);color:var(--muted);font-size:14px}
.notice.err{color:var(--out)}
.hint{font-size:12px;color:var(--muted)}

.tools{display:flex;flex-direction:column;gap:10px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.search select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);max-width:40%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:var(--sunk);font-size:13px;color:var(--muted)}
.bulk label{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--fg)}
.bulk .sp{flex:1}
.bulk .btn{padding:7px 12px;font-size:13px}
input[type=checkbox].ck{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lrow{display:grid;grid-template-columns:auto 38px minmax(0,1fr) 74px auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow.s-out{box-shadow:inset 3px 0 0 var(--out)} .lrow.s-low{box-shadow:inset 3px 0 0 var(--low)}
.lrow.sel{background:color-mix(in srgb,var(--tape) 18%,var(--surface))}
.lrow.dispose{background:color-mix(in srgb,var(--tape) 28%,var(--surface))}
.lt{width:38px;height:38px;border-radius:8px;background:var(--sunk);border:0;padding:0;overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:var(--muted)}
.lt img{width:100%;height:100%;object-fit:cover}
.ln{min-width:0;display:flex;flex-direction:column;gap:1px}
.ln input{width:100%;padding:5px 7px;border-radius:7px;border:1px solid transparent;background:transparent;font-weight:700;font-size:14.5px;min-width:0}
.ln input:hover{border-color:var(--line)} .ln input:focus{border-color:var(--accent);background:var(--surface)}
.ln small{font-size:11px;color:var(--muted);padding-left:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln small .pill{font-size:10px;padding:1px 6px;margin-right:4px}
.lq{display:flex;align-items:center;gap:3px;min-width:0}
.lq input{width:100%;min-width:0;padding:7px 2px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:15px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.lq input:placeholder-shown{border-style:dashed}
.lq small{font-size:11px;color:var(--muted);max-width:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:15px;flex:none;display:grid;place-items:center}
.ib.del{color:var(--out)}
.ib.del[data-armed]{background:var(--out);color:#fff;border-color:var(--out)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent)}
.thumb{aspect-ratio:4/3;max-width:100%;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{font-family:var(--f-display);font-size:28px;color:var(--line)}
.label{position:absolute;top:8px;left:8px;background:var(--tape);color:var(--tape-ink);font-family:var(--f-mono);font-weight:600;font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.cbody{padding:10px 11px 11px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cname{font-weight:700;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.cloc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:4px}
.qty{font-family:var(--f-mono);font-weight:600;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.qty small{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted);margin-left:3px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.pill.ok{background:var(--ok)} .pill.low{background:var(--low)} .pill.out{background:var(--out)} .pill.unk{background:var(--unk)}
.pill.dispose{background:var(--tape);color:var(--tape-ink)}
.card.s-out{border-color:var(--out)} .card.s-low{border-color:var(--low)}

.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.empty h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--fg)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.row .t{min-width:0}
.row .t b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.row .t span{font-size:12px;color:var(--muted)}
.delta{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.delta.in{color:var(--ok)} .delta.out{color:var(--out)} .delta.adj{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%}
.sect-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sect-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px}
.meta{font-size:12px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;padding:14px 20px;border-radius:999px;border:0;background:var(--fg);color:var(--bg);font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}

.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-top h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.x{border:0;background:var(--sunk);border-radius:999px;width:36px;height:36px;flex:none;font-size:18px}
.photo{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .pbtn{position:absolute;right:10px;bottom:10px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .qty{font-size:40px}
.move{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--sunk)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);padding:3px;border-radius:10px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;flex:none}
.stepper input{flex:1;min-width:0;text-align:center;font-family:var(--f-mono);font-size:22px;font-weight:600;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-width:0;width:100%}
.field textarea{min-height:60px;resize:vertical}
.camps{display:flex;gap:6px;flex-wrap:wrap}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;padding:4px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1}
.login .logo{width:56px;height:56px;border-radius:14px;background:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.login .logo span{display:block;width:30px;height:22px;background:var(--tape);border-radius:3px;position:relative}
.login .logo span::after{content:"";position:absolute;left:12px;top:0;width:6px;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div id="app"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const CATS=["문구","스티커","만들기 재료","인쇄·용지","운영 비품","간식·소모품","선물·보상","장비","위생·안전"];
const CAMPS=["공통","히스토리즘","Storythm3.0"];
const TABS=["list","stock","buy","log"];
const CFG=window.SUPPLY_CONFIG||{};
const S={sb:null,session:null,who:"",items:[],logs:[],tab:"list",q:"",cat:"전체",camp:"전체",open:null,loaded:false,sel:new Set(),online:navigator.onLine};

const $=s=>document.querySelector(s);
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="text")e.textContent=v;else e.setAttribute(k,v===true?"":v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k instanceof Node?k:document.createTextNode(String(k)))}return e}
function toast(msg){const t=h("div",{class:"toast",role:"status",text:msg});document.body.append(t);setTimeout(()=>t.remove(),2200)}
function status(it){const q=it.qty;if(q==null||q==="")return"unk";if(q<=0)return"out";if(it.min!=null&&it.min!==""&&q<it.min)return"low";return"ok"}
const SLBL={ok:"충분",low:"부족",out:"없음",unk:"미확인"};
function fmtDate(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";const p=n=>String(n).padStart(2,"0");return`${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`}
function photoURL(path){if(!path)return null;return S.sb.storage.from(CFG.bucket||"photos").getPublicUrl(path).data.publicUrl}
const now=()=>new Date().toISOString();
try{S.who=localStorage.getItem("supply.who")||""}catch(e){}

/* ---------- login ---------- */
function viewLogin(msg){
  const pw=h("input",{type:"password",id:"pw",placeholder:"공용 비밀번호",autocomplete:"current-password",required:true});
  const who=h("input",{type:"text",id:"who",placeholder:"내 이름 (기록에 남아요)",value:S.who,autocomplete:"nickname",required:true});
  const err=h("div",{class:"notice err",hidden:!msg,text:msg||""});
  const btn=h("button",{class:"btn primary",type:"submit"},"들어가기");
  const form=h("form",{onsubmit:async e=>{e.preventDefault();btn.disabled=true;err.hidden=true;
    const prevWho=S.who;S.who=who.value.trim();
    try{const {error}=await S.sb.auth.signInWithPassword({email:CFG.staffEmail,password:pw.value});
      if(error)throw error;
      try{localStorage.setItem("supply.who",S.who)}catch(x){}
    }catch(x){S.who=prevWho;err.textContent=/Invalid login/i.test(x.message||"")?"비밀번호가 맞지 않아요.":"로그인하지 못했어요: "+(x.message||x);err.hidden=false;btn.disabled=false}}},
    h("div",{class:"logo"},h("span")),
    h("h1",{text:"캠프 비품창고"}),h("div",{class:"meta",text:"스토리즘 캠프 공용 물품 · 재고 관리"}),
    h("div",{class:"field"},h("label",{for:"who",text:"이름"}),who),
    h("div",{class:"field"},h("label",{for:"pw",text:"비밀번호"}),pw),
    err,btn);
  $("#app").replaceChildren(h("div",{class:"login"},form));
  setTimeout(()=>(S.who?pw:who).focus(),50);
}

/* ---------- shell ---------- */
function shell(){
  const app=$("#app");
  app.replaceChildren(
    h("header",{class:"top"},h("div",{class:"wrap"},
      h("div",{class:"brand"},h("h1",{},"캠프 비품창고",h("small",{text:"스토리즘 캠프 공용 물품 · 재고 관리"})),
        h("button",{class:"me",title:"이름 바꾸기 / 나가기",onclick:accountSheet},h("b",{text:S.who||"이름 없음"}),"▾")),
      h("div",{class:"stats",id:"stats"}),
      h("nav",{class:"tabs",role:"tablist"},
        h("button",{role:"tab",id:"tab-list"},"목록"),h("button",{role:"tab",id:"tab-stock"},"카드"),
        h("button",{role:"tab",id:"tab-buy"},"구매 필요",h("span",{class:"n",id:"buyN"})),h("button",{role:"tab",id:"tab-log"},"기록")))),
    h("main",{},h("div",{class:"wrap",id:"view"},h("div",{class:"notice",text:"창고 목록을 불러오는 중이에요…"}))),
    h("button",{class:"fab",id:"fab",hidden:true,onclick:newItem},"+ 물품 추가"),
    h("div",{id:"sheetRoot"}));
  for(const t of TABS)$("#tab-"+t).addEventListener("click",()=>{S.tab=t;render()});
}
function accountSheet(){
  const who=h("input",{value:S.who,placeholder:"내 이름"});
  const close=openSheet("내 정보",[h("div",{class:"field"},h("label",{text:"기록에 남는 이름"}),who),
    h("div",{class:"actions"},h("button",{class:"btn danger",onclick:async()=>{await S.sb.auth.signOut();close()}},"나가기"),
      h("button",{class:"btn primary",onclick:()=>{S.who=who.value.trim();try{localStorage.setItem("supply.who",S.who)}catch(e){};close();shell();render()}},"저장"))]);
}

/* ---------- render ---------- */
function renderStats(){
  const it=S.items,low=it.filter(i=>status(i)==="low").length,out=it.filter(i=>status(i)==="out").length,unk=it.filter(i=>status(i)==="unk").length;

    if(!armed){armed=true;del.textContent="한 번 더 누르면 삭제";setTimeout(()=>{armed=false;del.textContent="물품 삭제"},4000);return}
    try{await deleteItems([it.id]);closeFn();toast("물품을 삭제했어요")}catch(e){writeFail(e)}}},"물품 삭제");
  body.push(h("details",{},h("summary",{text:"물품 정보 고치기"}),h("div",{style:"display:flex;flex-direction:column;gap:12px;padding-top:10px"},box,h("div",{class:"actions"},del,saveInfo))));
  const mine=S.logs.filter(l=>l.item_id===it.id).slice(0,8);
  if(mine.length)body.push(h("details",{open:true},h("summary",{text:"최근 기록"}),h("div",{class:"list",style:"margin-top:8px"},...mine.map(l=>logRow(l,false)))));
  else body.push(h("div",{class:"meta",text:"아직 이 물품의 입출고 기록이 없어요."}));
  const closeFn=openSheet(it.name,body);
}

/* ---------- data ---------- */
async function reload(){
  const [a,b]=await Promise.all([
    S.sb.from("items").select("*").order("name"),
    S.sb.from("logs").select("*").order("at",{ascending:false}).limit(200)]);
  if(a.error)throw a.error;if(b.error)throw b.error;
  S.items=a.data||[];S.logs=b.data||[];S.loaded=true;rerender();
}
async function updateItem(id,patch){const {error}=await S.sb.from("items").update({...patch,updated_at:now(),updated_by:S.who}).eq("id",id);if(error)throw error}
async function addLog(d){const {error}=await S.sb.from("logs").insert({...d,camp:d.camp||"",memo:d.memo||"",at:now(),by_name:S.who});if(error)throw error}
async function saveName(it,val,el){
  const v=val.trim();if(!v){el.value=it.name||"";toast("이름은 비울 수 없어요");return}
  if(v===it.name)return;
  try{await updateItem(it.id,{name:v});it.name=v;toast(`‘${v}’로 바꿨어요`);reload().catch(()=>{})}catch(e){el.value=it.name||"";writeFail(e)}
}
async function saveQty(it,val,el){
  const n=val===""?null:Math.max(0,Math.floor(Number(val)||0));
  const cur=it.qty==null?null:Number(it.qty);if(n===cur)return;
  try{await updateItem(it.id,{qty:n});
    if(n!=null)await addLog({item_id:it.id,item_name:it.name,type:"adjust",delta:n-(cur||0),qty_after:n,memo:"목록에서 입력"});
    it.qty=n;toast(n==null?"수량을 미확인으로 돌렸어요":`${it.name} ${n}${it.unit||""}`);reload().catch(()=>{});
  }catch(e){el.value=cur==null?"":String(cur);writeFail(e)}
}
async function deleteItems(ids){
  for(const id of ids){const it=S.items.find(i=>i.id===id);if(!it)continue;
    const {error}=await S.sb.from("items").delete().eq("id",id);if(error)throw error;S.sel.delete(id);
    if(it.photo){try{await S.sb.storage.from(CFG.bucket||"photos").remove([it.photo])}catch(e){}}}
  await reload();
}
let bulkArmed=false;
async function bulkDelete(btn){
  const ids=filtered().map(i=>i.id).filter(id=>S.sel.has(id));if(!ids.length)return;
  if(!bulkArmed){bulkArmed=true;btn.textContent=`정말 ${ids.length}개 삭제?`;setTimeout(()=>{bulkArmed=false;drawBulk(filtered())},4000);return}
  bulkArmed=false;btn.disabled=true;btn.textContent="삭제하는 중…";
  try{await deleteItems(ids);toast(`${ids.length}개를 삭제했어요`)}catch(e){writeFail(e);drawList()}
}
function writeFail(e){
  const m=(e&&e.message)||"";
  if(/JWT|not authenticated|401|403|row-level/i.test(m)){toast("로그인이 풀렸어요. 다시 들어가 주세요");S.sb.auth.signOut()}
  else if(!navigator.onLine)toast("인터넷이 끊겨 저장하지 못했어요");
  else toast("저장하지 못했어요: "+(m||"잠시 뒤 다시 시도해 주세요"));
}

/* ---------- photos ---------- */
let photoTarget=null;
function pickPhoto(it){photoTarget=it;const inp=$("#photoInput");inp.value="";inp.click()}
async function shrink(file){
  try{const bmp=await createImageBitmap(file);const max=1280,s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.82));}catch(e){return file}
}
$("#photoInput").addEventListener("change",async e=>{
  const file=e.target.files&&e.target.files[0];const it=photoTarget;if(!file||!it)return;
  toast("사진을 올리는 중이에요…");
  try{const blob=await shrink(file);const path=`${it.id}/${Date.now()}.jpg`;
    const up=await S.sb.storage.from(CFG.bucket||"photos").upload(path,blob,{contentType:"image/jpeg",upsert:false});if(up.error)throw up.error;
    const old=it.photo;await updateItem(it.id,{photo:path});
    if(old){try{await S.sb.storage.from(CFG.bucket||"photos").remove([old])}catch(x){}}
    await reload();toast("사진을 붙였어요");
  }catch(err){toast("사진을 올리지 못했어요: "+((err&&err.message)||""))}
});

/* ---------- rerender (keeps focus & open sheet) ---------- */
let rr=0;function rerender(){cancelAnimationFrame(rr);rr=requestAnimationFrame(()=>{
  if(!$("#view"))return;
  const act=document.activeElement,ae=act&&act.id;const pos=ae==="q"?act.selectionStart:null;
  if(act&&act.closest&&act.closest("#list")&&act.tagName==="INPUT"&&act.type!=="checkbox"){pendingRR=true;renderStats();return}
  if(S.tab==="stock"&&$("#grid")){renderStats();drawGrid()}
  else if(S.tab==="list"&&$("#list")){renderStats();drawList()}
  else render();
  if(S.open){const sc=$(".sheet")?.scrollTop||0;const openDetails=[...document.querySelectorAll(".sheet details")].map(d=>d.open);
    const a=document.activeElement;const editing=a&&a.closest&&a.closest(".sheet")&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
    if(!editing){openItem(S.open);const sh=$(".sheet");if(sh){sh.scrollTop=sc;[...sh.querySelectorAll("details")].forEach((d,i)=>{if(openDetails[i]!=null)d.open=openDetails[i]})}}}
  if(ae==="q"){const q=$("#q");if(q){q.focus();if(pos!=null)q.setSelectionRange(pos,pos)}}
})}

/* ---------- boot ---------- */
let channel=null;
function subscribe(){
  if(channel)return;
  channel=S.sb.channel("supply").on("postgres_changes",{event:"*",schema:"public",table:"items"},()=>reload().catch(()=>{}))
    .on("postgres_changes",{event:"*",schema:"public",table:"logs"},()=>reload().catch(()=>{})).subscribe();
}
function unsubscribe(){if(channel){S.sb.removeChannel(channel);channel=null}}
async function enter(){
  shell();render();
  try{await reload()}catch(e){$("#view").replaceChildren(h("div",{class:"notice err",text:"목록을 불러오지 못했어요: "+(e.message||e)}))}
  subscribe();
}
(async()=>{
  if(!window.supabase||!CFG.supabaseUrl||/YOUR-PROJECT/.test(CFG.supabaseUrl)){
    $("#app").replaceChildren(h("div",{class:"login"},h("div",{class:"notice err",text:"config.js 에 Supabase 주소와 키를 먼저 넣어 주세요."})));return}
  S.sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  const {data}=await S.sb.auth.getSession();S.session=data.session;
  S.sb.auth.onAuthStateChange((ev,sess)=>{const had=!!S.session;S.session=sess;
    if(sess&&!had){enter()}else if(!sess&&had){unsubscribe();S.loaded=false;S.items=[];S.logs=[];viewLogin()}});
  if(S.session)enter();else viewLogin();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.session)reload().catch(()=>{})});
  window.addEventListener("online",()=>{if(S.session)reload().catch(()=>{})});
  if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
